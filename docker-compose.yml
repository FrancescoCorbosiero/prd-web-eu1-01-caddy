# Caddy Docker Proxy - Reverse Proxy Infrastructure
# Run this FIRST before any WordPress sites
# Usage: docker compose up -d
# After changing this file, apply it with `docker compose up -d`
# (never `restart`, which does not apply compose changes; never `down`, which removes the shared caddy network)

networks:
  caddy:
    name: caddy
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
      # Cloudflare Origin Certificate for *.alpacode.it (alpacode-origin.pem / .key), files kept only on the server, never in git; add a caddy.tls label pointing to /certs only after these files exist, or the whole proxy config fails to load
      - ./certs:/certs:ro
    labels:
      # Global Caddy options (applied to all sites)
      caddy.email: ${ACME_EMAIL:-admin@example.com}
